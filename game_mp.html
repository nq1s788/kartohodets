<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Картоходец - Мультиплеер</title>

    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDuLp1CUBzwTWRhkyUT4PYR4RnXuEE_UmA&callback=initMap&v=weekly&libraries=marker,geometry"
        async defer></script>

    <script src="game_mp.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="top-bar" style="position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.7); z-index: 1000; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box;">
        <div>Лобби: <span id="lobby-id">---</span></div>
        <div id="timer" style="font-size: 24px; font-weight: bold; color: yellow;"></div>
        <div>Игроков: <span id="player-count">0</span></div>
    </div>

    <div id="cover">
        <div id="maps" class="hidden">
            <div id="map" style="height: 400px; width: 100%;"></div>
            <div id="street-view" style="height: 400px; width: 100%;"></div>
        </div>
        <div id='search'>Ожидание сервера...</div>
    </div>

    <div id="distanceDisplay"></div>

    <button disabled="true" class='bt' id="guess">Угадать</button>

    <div id="host-controls" class="hidden" style="position: absolute; bottom: 80px; width: 100%; text-align: center; pointer-events: none;">
        <button class='bt' id="next-round" style="pointer-events: auto;">Следующий раунд</button>
        <button class='bt' id="end-game" style="pointer-events: auto; background: red;">Завершить игру</button>
    </div>

</body>
</html>
